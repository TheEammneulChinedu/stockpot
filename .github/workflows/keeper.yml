name: keeper

# Pushes every Stockpot pot forward: pulls auto-pay contributions, settles due rounds
# (0x quote + Chainlink price guard on-chain), and sends withdrawable stock to members.
on:
  schedule:
    - cron: "*/10 * * * 1-5" # every 10 minutes, Monday to Friday (UTC)
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npm run tick
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
          BUILDER_CODE: ${{ vars.BUILDER_CODE }}
